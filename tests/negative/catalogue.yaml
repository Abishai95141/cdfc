      a file that a guard would catch, because the thing being claimed is what somebody has never
      seen.
    what_it_costs: >
      Every BLIND-FILLED false-failure rate rests on a procedure rather than on a test. It is the
      single largest unverifiable input to the product's headline claim - and it is why
      SELF-AUTHORED renders the word `uninformative` rather than a number: we would rather print
      nothing than print a number whose shape is evidence and whose content is zero. Today it costs
      nothing further, because D-P8-01 records that no blind fill exists at all and
      n_non_synthetic is 0.
