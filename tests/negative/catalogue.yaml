  - id: NC-A20
    component: attest
    break: an INVALID run is projected to an OSCAL Assessment Result with zero findings, which is schema-valid and reads as clean
    measured_instance: "OSCAL's finding-target.status.state is a closed two-value enum {satisfied, not-satisfied} and findings became optional in 2021"
