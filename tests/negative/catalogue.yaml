    measured_instance: "gate 10's registered broken_build could not make it red; this one can"
    injector: HardcodeCountAndAddRow
    guard_tests:
      - path: "tests/unit/test_cli.py::test_cli__version_reports_gate_count"
        flips: true
    positive_control: "the real CLI reads the registry, so the count tracks a new row automatically"
    status: active

  - id: NC-CI13
    component: licences
    break: a denylisted licence enters the resolved runtime set
    measured_instance: "a licence nobody opened is not a licence; this is a hard block from P2"
    injector: DenylistedRuntimeDep
    guard_tests:
      - path: "tests/negative/test_nc_ci.py::test_nc__CI13_denylisted_runtime_licence_is_rejected"
        flips: true
    positive_control: "the four real runtime deps pass, all labelled SECONDARY"
    status: active
    note: >
      The guard applies the SAME break it asserts against, so under the sweep's outer
      injection its precondition ("green on a correct tree") correctly goes red. It is
      declared flips:true for that reason, and the gate exit code inside the guard is
      the evidence that the gate itself rejects.

