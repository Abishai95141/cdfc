        flips: true
      - path: "tests/negative/test_nc_verdict.py::test_nc__E21b_an_empty_evaluation_set_still_has_a_row"
        flips: false
    positive_control: "a cell nothing happened to is present, NO_PREDICATE, and counted"
    status: active

