  - id: NC-CI16
    component: plan
    break: a displayed total stops equalling the sum of its own rows
    measured_instance: "the plan's critical-path row displayed 118 while its parts summed to 127"
    injector: BreakCriticalPathTotal
    guard_tests:
      - path: "tests/contract/test_contract_plan.py::test_plan__critical_path_total_equals_sum_of_rows"
        flips: true
      - path: "tests/contract/test_contract_plan.py::test_plan__the_total_check_can_fail"
        flips: false
    positive_control: "the real plan row sums to its displayed total"
    status: active
