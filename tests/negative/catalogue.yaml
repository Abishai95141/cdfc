  - id: NC-Q02
    component: predicates
    break: a predicate with no qualification record loads
    measured_instance: "the admission rule the settled-fraction claim rests on"
    injector: LoaderSkipsQualificationCheck
    guard_tests:
      - path: "tests/negative/test_nc_predicate.py::test_nc__Q02b_the_predicate_loader_refuses_an_unqualified_envelope"
        flips: true
      - path: "tests/unit/test_envelope.py::test_load_predicate__missing_qualification_raises"
        flips: true
      - path: "tests/negative/test_nc_predicate.py::test_nc__Q02c_a_qualified_predicate_does_load"
        flips: false
      - path: "tests/unit/test_registry.py::test_nc__Q02_unqualified_predicate_does_not_load"
        flips: false
    positive_control: "fixtures/predicates/good/P-0007 carries a qualification record and DOES load"
    status: active
    resolved: >
      PROVISIONAL from P0 to P3 and RESOLVED at P4, dated 12 Aug 2026. The entry was reported in
      its own column and excluded from entries_caught because its admission-side twin — a
      QUALIFIED predicate that DOES load — could not be written until the predicate schema
      existed. P4-B1 gives the schema, so both sides are now real: `load_predicate` refuses
      P-NC02 and accepts P-0007, and `LoaderSkipsQualificationCheck` makes the refusal green.
      The P0 registry stub stays as a `flips: false` guard: it refuses unconditionally and is
      not the thing the injector touches, so it is the control on the control.

