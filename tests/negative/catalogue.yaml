# THE machine-readable negative-control catalogue.
#
# Every entry names a real break, the injector that performs it, and the guards that must
# react. `flips: true` guards MUST go red under the injector; `flips: false` guards are
# POSITIVE CONTROLS and must stay green — without them a gate that rejects everything
# scores perfectly.
#
# The sweep asserts the EXACT SET, never "at least one". An entry is caught only when
# every declared flips:true guard flipped and every flips:false guard held.
version: 1
entries:
  - id: NC-CI01
    component: ci
    break: a grep gate whose scan root does not exist reports success
    measured_instance: "grep -r pat missing/ exits 0; found in this project's own CI design"
    injector: DefeatBareExceptGate
    guard_tests:
      - path: "tests/negative/test_nc_ci.py::test_nc__CI01_missing_scan_root_fails"
        flips: true
    positive_control: "an existing but empty scan root still passes"
    status: active

  - id: NC-CI02
    component: ci
    break: openpyxl's data-validation warning is discarded instead of raised
    measured_instance: "openpyxl 3.1.5 reports 35 of 54 validations on the FME workbook; AML-CFT 0 of 5"
    injector: WarningsTolerated
    guard_tests:
      - path: "tests/negative/test_nc_ci.py::test_nc__CI02_openpyxl_warning_is_an_error"
        flips: false
      - path: "tests/negative/test_nc_ci.py::test_nc__CI02b_the_warning_is_real_not_a_test_artifact"
        flips: false
      - path: "tests/negative/test_nc_ci.py::test_nc__CI02c_the_config_is_what_makes_warnings_errors"
        flips: true
    positive_control: "the warning genuinely originates from the artifact, not from simplefilter"
    status: active
    note: >
      The first two guards install their own filter and hold under the injector; the
      third runs a subprocess pytest that reads pyproject.toml and flips.
    resolved: >
      Previously PROVISIONAL because both guards installed their own filter and so could
      not tell whether the config existed at all. CI02c runs a throwaway test through
      pytest from the repo, where pyproject.toml applies, and flips when the config is
      relaxed. Gate 4 is now demonstrable.

