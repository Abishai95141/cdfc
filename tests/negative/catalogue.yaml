    positive_control: "tests/e2e/test_e2e__verify.py::test_e2e__VERIFY_byte_identical — the honest path still reports both facts, so the refusal is not a reject-everything baseline"
    status: active
    note: >
      The guard is an AST walk rather than a behavioural test, and deliberately: it asserts that
