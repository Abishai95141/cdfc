    positive_control: "tests/negative/test_nc_model.py::test_nc__M34c_a_correctly_ordered_exclusion_and_draw_pair_passes -- the ordering rule permits the honest sequence, so it is an ORDER and not a prohibition"
    status: active
    note: >
      The injector reorders APPENDABLE without touching the `if` that reads it, which is what
