  # --- P5: run assembly, the verdict model, closure, the settled fraction ------------
  #
  # ID ALLOCATION, CORRECTED. The plan gives this document the band E20-E29. **E20-E23 were
  # already taken** by P3 (money scaled twice, the warrant lattice, a leaf without __cell__, a
  # relative tolerance) — and the catalogue is keyed by `id`, so appending E20 here would have
  # SILENTLY REPLACED P3's entry, taking its guard with it. `test_nc_meta__ids_are_unique` caught
  # it, which is the whole reason that test exists. This block is E30-E37.
  # Ids are inside this document's E20-E29 band (`02` R5a).

  - id: NC-E30
    note: >
      The guard functions keep their `E20`-style names: they name the DEFECT, which is what a
      reader greps for, and renaming them would break every DoD line that cites a node id. The
      catalogue row is what had to move.
    component: evaluate
    break: cells_bound is computed AFTER expr, so the vacuous pass is produced and then corrected
    measured_instance: "`all([])` is True; a design that overwrites its own PASS is trusting itself to"
    injector: CellsBoundAfterExpr
    guard_tests:
      - path: "tests/negative/test_nc_verdict.py::test_nc__E20_cells_bound_zero_is_error_before_expr_runs"
        flips: true
      - path: "tests/golden/test_p5_runtime.py::test_golden__cells_bound_zero_is_error_and_invalidates_the_run"
        flips: true
      - path: "tests/negative/test_nc_verdict.py::test_nc__E20b_a_predicate_that_binds_cells_still_runs"
        flips: false
    positive_control: "a predicate that binds cells still runs"
    status: active

