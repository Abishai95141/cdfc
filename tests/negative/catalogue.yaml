        flips: false
    positive_control: "tests/unit/test_oscal.py::test_oscal__valid_run_projects_and_declares_its_loss — a VALID run DOES project, so the refusal is about INVALID and not about the projector"
    status: active

  # ===================================================================================
  # P12 — the settling experiment. Nine entries, and they guard a different thing from
  # every phase below: P12 produces no verdict, so its controls are about whether the
  # criterion could have been written to fit the result.
  # ===================================================================================

  - id: NC-M02
    component: experiment
    break: PREREGISTRATION.md is edited after the run -- a threshold is moved to fit the result
    measured_instance: "the specification's own P(X<=2 | n=20, p=0.30) is printed as 0.036 and is 0.035; a document nobody re-derives is a document that drifts"
    injector: PreregEditThreshold
    guard_tests:
      - path: "tests/negative/test_nc_model.py::test_nc__M02a_h0_mismatch_fails_the_build"
        flips: true
      - path: "tests/negative/test_nc_model.py::test_nc__M02b_the_committed_threshold_is_the_one_the_code_uses"
        flips: true
      - path: "tests/negative/test_nc_model.py::test_nc__M02c_appending_an_artefact_hash_is_allowed"
        flips: false
    positive_control: "tests/negative/test_nc_model.py::test_nc__M02c_appending_an_artefact_hash_is_allowed -- the lock is append-only, NOT frozen, so a lock that refused every write would satisfy both rejection guards while making the experiment unrunnable"
    status: active
    note: >
      The positive control is built from the MODULE CONSTANTS rather than copied from the
      committed document, because the injector edits that document. A flips:false guard that
      went red for the right reason would still be the wrong guard.

  - id: NC-M03
    component: experiment
    break: the decidable fraction is computed over a denominator the Stratum-B generation cap truncated
    measured_instance: "the same mechanism as NC-D01: a cap on what is PROCESSED silently becomes a cap on what is COUNTED"
    injector: TruncateBDenominator
    guard_tests:
      - path: "tests/negative/test_nc_model.py::test_nc__M03_decidable_fraction_uses_all_drawn"
        flips: true
      - path: "tests/property/test_prop_experiment_draw.py"
        flips: false
      - path: "tests/negative/test_nc_model.py::test_nc__M03b_the_generation_cap_still_bites"
        flips: false
    positive_control: "tests/negative/test_nc_model.py::test_nc__M03b_the_generation_cap_still_bites -- 'the cap never touches the denominator' would otherwise be satisfiable by removing the cap, which would send ninety Stratum-B obligations to the model at ten candidates each"
    status: active
    note: >
      The injector attacks the REPORTING path, not the constructor. Truncating stratum_b_all at
      construction is refused by Draw.__post_init__, so draw() raised and every guard went red
      including the positive control -- an injector that breaks the harness rather than the
      measurement. That the invariant catches the constructional form is the stronger property.

  - id: NC-M04
    component: experiment
    break: "|A|/|drawn| is reported as an unbiased estimate under inverse sampling, and its Wilson interval as exact"
    measured_instance: "drawing until a fixed number of successes biases a/n upward; the unbiased estimator is (a-1)/(n-1)"
    injector: NaiveRatioEstimator
    guard_tests:
