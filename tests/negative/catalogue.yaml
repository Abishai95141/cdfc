  - id: NC-M13
    component: experiment
    break: a model client is reachable from the qualification or verdict path, so the gate adjudicates using the thing it is adjudicating
    measured_instance: "LLM judges detect false success at AUROC <= 0.65 and 13% recall at a 10% flag rate"
    injector: ModelClientInQualify
    guard_tests:
