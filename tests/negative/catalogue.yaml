        flips: true
      - path: "tests/negative/test_nc_verdict.py::test_nc__E03c_the_generator_still_writes_the_table"
        flips: true
    positive_control: "the generator does write the table — E03c reads it, so an empty generator fails too"
    note: >
      `test_contract__generated_doc_is_byte_identical` is deliberately NOT a guard here. It runs
      the generator, which REWRITES the file, so it heals the hand edit for every guard after it
      in the same pytest process. A guard that repairs the break is not a guard.
    status: active

