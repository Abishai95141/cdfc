    measured_instance: "a crash that looks like a limit — mechanism 6 of the silent-pass taxonomy"
    injector: DefeatBareExceptGate
    guard_tests:
      - path: "tests/negative/test_nc_ci.py::test_nc__CI04_bare_except_is_rejected"
