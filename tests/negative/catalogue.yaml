      - path: "tests/unit/test_experiment_power.py::test_power__inverse_sampling_estimator_is_a_minus_one_over_n_minus_one"
        flips: true
      - path: "tests/negative/test_nc_model.py::test_nc__M04b_interval_carries_the_approximate_label"
        flips: false
    positive_control: "tests/negative/test_nc_model.py::test_nc__M04b_interval_carries_the_approximate_label -- the label survives, so the guard is about the arithmetic rather than about the string"
    status: active

