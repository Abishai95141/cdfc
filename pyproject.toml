[project]
name = "cdfc"
version = "0.0.1"
description = "The coverage-declaring filing checker — a regulated-filing checker that reports what it did not check"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
readme = "BUILD-PLAN.md"

dependencies = [
  "lxml==6.1.1",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
# BUILD-TIME ONLY. Nothing in `src/` imports these: the pinned `corpus/instruments/*.text.json` is
# what the system reads, and adding three PDF parsers to the runtime closure of a package whose
# claim is a small auditable verdict path would be the wrong trade. `pymupdf` is deliberately
# ABSENT -- AGPL-3.0, denied by ci/licence-denylist.sh, and it was the arm that scored best.
# Guarded by ci/no-denied-build-tool.sh (registry row 116).
pdf = [
  "pdfplumber==0.11.10",
  "pypdfium2==5.13.0",
]
dev = [
  "pytest==8.3.4",
  "hypothesis==6.122.3",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "coverage==7.6.9",
]

[project.scripts]
cdfc = "cdfc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# THE NON-NEGOTIABLE BLOCK (methodology §1.0)
#
# filterwarnings = ["error"] is not hygiene. openpyxl emits
#   "Data Validation extension is not supported and will be removed"
# when it reads the FME workbook — and that discarded warning is exactly how a
# parser comes to report 35 of 54 validations, and the AML-CFT sheet as having
# zero when it has five. This project exists to stop discarding that signal.
# Guarded by tests/negative/test_nc_ci.py::test_nc__CI02_openpyxl_warning_is_an_error.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -q"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "linux_only: collected only in the Linux CI image (R7)",
]
testpaths = ["tests"]
# `tests/` ON THE PATH, and it is a repair rather than a convenience.
#
# `tests/negative/test_nc_model_free.py` does `from negative.importgraph import ...`. With pytest's
# default prepend import mode and no `__init__.py` under `tests/`, the directory pytest inserts is
# `tests/negative` — so the package `negative` does not exist and the module fails to IMPORT.
# A collection error is not a failing test: pytest aborts the whole run, so `make verify` could not
# reach a single assertion, and the model-free guard that P13-B0 exists to enforce had never run
# inside a full-suite invocation.
#
# `src` is here for the same reason: the suite should not depend on the caller remembering to
# export `PYTHONPATH`, which is exactly the fresh-clone friction the Makefile's interpreter
# discovery was written to remove.
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL"]
# E722 (bare except) is deliberately NOT relied on here: ci/no-bare-except.sh is the
# gate, because a linter configuration can be relaxed in the same commit as the
# violation it would have caught. The shell gate has its own negative control.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cdfc"]
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["src/cdfc"]
